<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{AppTitle}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen bg-slate-50 text-slate-800">
    <div id="toast-container" class="fixed right-5 top-5 z-50 flex flex-col gap-2"></div>
    <aside class="hidden w-64 shrink-0 bg-slate-900 text-white md:flex md:flex-col">
        <div class="border-b border-slate-800 p-6"><h2 class="text-xl font-bold">{{AppTitle}}</h2></div>
        <nav class="flex-1 space-y-2 p-4">{{sidebarLinks}}</nav>
    </aside>
    <div class="flex min-w-0 flex-1 flex-col">
        <header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-6">
            <span class="font-medium text-slate-600">{{CurrentSectionTitle}}</span>
            <span class="rounded-full bg-slate-100 px-3 py-1 text-sm font-semibold text-slate-700">Admin</span>
        </header>
        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
            <div class="mx-auto max-w-5xl space-y-6">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <h1 class="text-2xl font-bold text-slate-900">{{EntityPluralTitle}}</h1>
                    <button id="btn-show-form-{{entityLower}}" type="button" class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">+ Nouveau {{EntitySingularTitle}}</button>
                </div>
                <section id="section-form-{{entityLower}}" class="hidden rounded-lg border border-slate-200 bg-white p-6">
                    <h2 class="mb-4 text-lg font-bold">Ajouter {{EntitySingularTitle}}</h2>
                    <form id="form-{{entityLower}}" class="space-y-4">
                        <input type="hidden" id="{{entityLower}}-id">
{{formFields}}
                        <div class="flex justify-end gap-2">
                            <button type="button" id="btn-cancel-form-{{entityLower}}" class="rounded-lg border border-slate-300 px-4 py-2">Annuler</button>
                            <button type="submit" id="enregistrer-{{entityLower}}" class="rounded-lg bg-indigo-600 px-4 py-2 text-white">Enregistrer</button>
                        </div>
                    </form>
                </section>
                <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
                    <table class="w-full text-left">
                        <thead class="border-b bg-slate-50"><tr><th class="p-4 text-xs uppercase text-slate-500">ID</th>{{tableHeaders}}<th class="p-4 text-xs uppercase text-slate-500">Actions</th></tr></thead>
                        <tbody id="table-{{entitiesLower}}-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="assets/js/app.js" defer></script>
</body>
</html>
